# Imagem da Evolution com a alteração do KannChat (recibo de grupo).
#
# Roda só à mão (Actions → Imagem KannChat → Run workflow), com a tag da imagem.
# Publica para amd64 e arm64, cada uma montada no próprio processador, como a
# imagem oficial. Recusa sobrescrever uma tag que já existe: a tag anterior é o
# rollback e tem que continuar apontando para o mesmo conteúdo.

name: Imagem KannChat

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Tag da imagem (ex.: 2.3.7-kannchat.1)"
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGEM: ghcr.io/agenciakann/evolution-api
  VERSAO: ${{ inputs.versao }}

jobs:
  confere:
    runs-on: ubuntu-24.04
    steps:
      - name: Tag válida e ainda não publicada
        run: |
          [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+-kannchat\.[0-9]+$ ]] || { echo "tag fora do formato"; exit 1; }
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker buildx imagetools inspect "$IMAGEM:$VERSAO" >/dev/null 2>&1; then
            echo "$IMAGEM:$VERSAO já existe"; exit 1
          fi

  monta:
    needs: confere
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGEM }},push-by-digest=true,name-canonical=true,push=true
      - name: Guarda o digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p /tmp/digests && touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          retention-days: 1

  publica:
    needs: monta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Junta as duas arquiteturas na tag
        working-directory: /tmp/digests
        run: docker buildx imagetools create -t "$IMAGEM:$VERSAO" $(printf "$IMAGEM@sha256:%s " *)
      - run: docker buildx imagetools inspect "$IMAGEM:$VERSAO"
